name: docker security scan

# Run each workflow once per change: pull_request covers feature branches
# (pushing a branch with an open PR previously triggered a duplicate push
# run), push covers the long-lived and release branches that deploy images.
on:
  push:
    branches:
      - develop
      - master
      - '*.*.*'   # release branches, e.g. 3.11.0
      - '*-LTS'   # e.g. 2.9.X-LTS
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  USE_TESTING_TIMEOUTS: "true"
  OPENSTUDIO_VERSION: 3.11.0
  OPENSTUDIO_VERSION_SHA: 241b8abb4d
  OPENSTUDIO_VERSION_EXT: ""
  DOCKER_COMPOSE_VERSION: 1.29.2
  BUNDLE_WITHOUT: native_ext


jobs:
  docker-scan:
    runs-on: ubuntu-24.04
    steps: 
    - name: Check out repository
      uses: actions/checkout@v2
    - name: setup
      shell: bash 
      run: ./ci/github-actions/setup.sh
      env:
        BUILD_TYPE: docker
    - name: docker
      shell: bash 
      run: |
          export OPENSTUDIO_TAG=3.11.0
          sed -i -E "s/.git//g" .dockerignore
          docker volume create --name=osdata
          docker images --all
          docker --version
          docker-compose --version
          docker-compose -f docker-compose.test.yml build --build-arg OPENSTUDIO_VERSION=$OPENSTUDIO_TAG web 
      env: 
        CI: true
        OS_SERVER_NUMBER_OF_WORKERS: 4
        BUILD_TYPE: docker
        COMPOSE_INTERACTIVE_NO_CLI: 1
    - name: Cleanup Docker resources and space
      shell: bash
      run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
    - name: Run docker vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        # the image should have been built and tagged in the previous steps
        image-ref: 'nrel/openstudio-server:latest'
        format: 'template'
        template: '@/contrib/sarif.tpl'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        timeout: 15m0s
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload container scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v1
      with:
        sarif_file: 'trivy-results.sarif'
