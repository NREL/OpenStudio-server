name: openstudio-server

# Run each workflow once per change: pull_request covers feature branches
# (pushing a branch with an open PR previously triggered a duplicate push
# run), push covers the long-lived and release branches that deploy images.
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
      - '179'     # OS 3.10.0 branch, deploys 3.10.0-179 images
      - '*.*.*'   # release branches, e.g. 3.10.0
      - '*-LTS'   # e.g. 2.9.X-LTS
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  USE_TESTING_TIMEOUTS: "true"
  OPENSTUDIO_VERSION: 3.10.0
  OPENSTUDIO_VERSION_SHA: 86d7e215a1
  OPENSTUDIO_VERSION_EXT: ""
  DOCKER_COMPOSE_VERSION: 2.38.2
  BUNDLE_WITHOUT: native_ext


jobs:
  linux-test:
    runs-on: ubuntu-24.04
    steps:
    - name: Delete huge unnecessary tools folder
      run: rm -rf /opt/hostedtoolcache 
    - name: Check out repository
      uses: actions/checkout@v4
    - name: setup
      shell: bash 
      run: ./ci/github-actions/setup.sh
      env:
        BUILD_TYPE: test
    - name: unit-test
      shell: bash 
      run: ./ci/github-actions/test.sh
      env:
        BUILD_TYPE: test
    - name: integration
      shell: bash 
      run: ./ci/github-actions/test.sh
      env:
        BUILD_TYPE: integration
        SKIP_URBANOPT_ALGO: true # Set this when excluding urbanopt-cli gem from server.
    - name: logs
      if: ${{ failure() }} 
      shell: bash 
      run: ./ci/github-actions/print_logs.sh
    - name: build gem package
      if: ${{ success() }}  
      shell: bash 
      run: ./ci/github-actions/export_build_linux.sh
    - name: upload gem package
      if: ${{ success() }} 
      uses: actions/upload-artifact@v4
      with:
        name: openstudio-server-gems-linux
        path: build/NREL/export/*.tar.gz
  macos-test:
    runs-on: macos-15-intel
    steps: 
    - name: Check out repository
      uses: actions/checkout@v4
    - name: setup
      shell: bash 
      run: ./ci/github-actions/setup.sh
      env:
        BUILD_TYPE: test
    - name: unit-test
      shell: bash 
      run: ./ci/github-actions/test.sh
      env:
        BUILD_TYPE: test
    - name: integration
      shell: bash 
      run: ./ci/github-actions/test.sh
      env:
        BUILD_TYPE: integration
        SKIP_URBANOPT_ALGO: true # Set this when excluding urbanopt-cli gem from server. 
    - name: logs
      if: ${{ failure() }}  
      shell: bash 
      run: ./ci/github-actions/print_logs.sh
    - name: build gem package
      if: ${{ success() }}  
      shell: bash 
      run: ./ci/github-actions/export_build_osx.sh
    - name: upload gem package
      if: ${{ success() }} 
      uses: actions/upload-artifact@v4
      with:
        name: openstudio-server-gems-darwin
        path: build/NREL/export/*.tar.gz
  docker:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      DEPLOY_ARCH: ${{ matrix.arch }}
      DOCKER_PLATFORM: ${{ matrix.platform }}
    steps:
    - name: Delete huge unnecessary tools folder
      run: rm -rf /opt/hostedtoolcache 
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Fix Docker Path for ARM64 Runner
      run: |
          if [ -f /usr/bin/docker ]; then
            echo "Docker already exists in /usr/bin"
          elif [ -f /usr/local/bin/docker ]; then
            sudo ln -s /usr/local/bin/docker /usr/bin/docker
          else
            # If not found in common locations, explicitly locate and export it
            DOCKER_BIN=$(which docker || find / -name docker -type f -perm -o+x 2>/dev/null | head -n 1)
            if [ ! -z "$DOCKER_BIN" ]; then
              sudo ln -s "$DOCKER_BIN" /usr/bin/docker
            fi
          fi
    - name: setup
      shell: bash 
      run: ./ci/github-actions/setup.sh
      env:
        BUILD_TYPE: docker
    - name: docker
      shell: bash 
      run: |
          export OPENSTUDIO_TAG=3.10.0
          sed -i -E "s/.git//g" .dockerignore
          docker volume create --name=osdata
          docker images --all
          docker --version
          docker compose --version
          if [ "${DEPLOY_ARCH}" = "arm64" ]; then
            # The first arm64 run may predate an arm64 entry in the :latest
            # manifests, so tolerate pull failure and build from scratch.
            # BuildKit also skips missing cache_from images without failing.
            docker compose -f docker-compose.test.yml pull || echo "arm64 pull skipped/failed; building from scratch"
          else
            docker compose -f docker-compose.test.yml pull
          fi
          # Rebuild the rserve image only when its inputs changed. PR runs otherwise reuse
          # the pulled nrel/openstudio-rserve:latest (kept fresh by docker-upload on
          # develop/master pushes): rebuilding R packages on every run cost ~10 min and
          # failed whenever CRAN had a transient outage or mid-day version drift.
          # Push runs always build everything - docker-upload deploys those images.
          # Two-commit tree diff (not A...B) so it works on the shallow PR merge-ref clone;
          # any fetch/diff failure falls back to building everything.
          BUILD_SERVICES="web rserve"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] \
             && git fetch --no-tags --quiet --depth=1 origin "${GITHUB_BASE_REF}" \
             && git diff --quiet FETCH_HEAD HEAD -- docker/R; then
            echo "docker/R is unchanged by this PR: reusing pulled nrel/openstudio-rserve:latest instead of rebuilding it"
            BUILD_SERVICES="web"
          fi
          docker compose -f docker-compose.test.yml build --build-arg OPENSTUDIO_VERSION=$OPENSTUDIO_TAG --build-arg DOCKER_PLATFORM=$DOCKER_PLATFORM $BUILD_SERVICES
          docker compose -f docker-compose.test.yml up -d
          #set SKIP_URBANOPT_ALGO=true to skip UrbanOpt algo tests
          docker compose exec -e SKIP_URBANOPT_ALGO=true -T web /usr/local/bin/run-server-tests
          docker compose stop
          git checkout -- .dockerignore && git checkout -- Dockerfile
      env: 
        CI: true
        OS_SERVER_NUMBER_OF_WORKERS: 4
        BUILD_TYPE: docker
        COMPOSE_INTERACTIVE_NO_CLI: 1
    - name: logs
      if: ${{ failure() }}  
      shell: bash 
      run: ./ci/github-actions/print_logs.sh
    - name: docker-upload
      if: |
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/3.10.0' ||
        github.ref == 'refs/heads/179' ||
        github.ref == 'refs/heads/fix/zip-read-only-extract'
      shell: bash
      run: ./docker/deployment/scripts/deploy_docker_github_actions.sh
      env: 
        CI: true
        BUILD_TYPE: docker
        # On forked Pull Requests secrets will not be sent to the runner. See more info here: 
        # https://docs.github.com/en/actions/reference/encrypted-secrets
        DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
  docker-manifest:
    # Merge the per-arch images pushed by the docker job into canonical
    # multi-arch manifests. Runs after BOTH matrix legs (amd64 + arm64) push.
    needs: docker
    runs-on: ubuntu-24.04
    if: |
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/3.10.0' ||
      github.ref == 'refs/heads/179' ||
      github.ref == 'refs/heads/fix/zip-read-only-extract'
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: setup
      shell: bash
      run: ./ci/github-actions/setup.sh
      env:
        BUILD_TYPE: docker
    - name: merge multi-arch manifests
      shell: bash
      run: ./docker/deployment/scripts/merge_manifests_github_actions.sh
      env:
        CI: true
        BUILD_TYPE: docker
        # On forked Pull Requests secrets will not be sent to the runner. See more info here:
        # https://docs.github.com/en/actions/reference/encrypted-secrets
        DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
