# Docker Compose creates multiple containers on a single machine.
# run `docker compose up` to create and run/link the containers
services:
  db:
    image: mongo:8.0.12
    ports:
      - "27017:27017"
    volumes:
      - dbdata:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command: "mongod --setParameter internalQueryMaxAddToSetBytes=${MONGO_MEM} --setParameter internalQueryMaxBlockingSortMemoryUsageBytes=${MONGO_MEM}"
  queue:
    image: redis:6.0.9
    ports:
      - "6379:6379"
    command: "redis-server --requirepass ${REDIS_PASSWORD} --maxclients 40000"
  web:
    image: nrel/openstudio-server:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      target: base
      args:
        rails_env: docker
    environment:
      - OS_SERVER_NUMBER_OF_WORKERS=${OS_SERVER_NUMBER_OF_WORKERS:-1}
      - QUEUES=analysis_wrappers
      - REDIS_URL=${REDIS_URL}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - OS_SERVER_EXTERNAL_BATCH_ROOT=/mnt/openstudio/external_batch
      - OS_SERVER_NOMAD_SSH_HOST=${OS_SERVER_NOMAD_SSH_HOST}
      - NOMAD_ADDR=${NOMAD_ADDR}
    depends_on:
      - db
      - queue
    ports:
      - "8080:80"
    volumes:
      - osdata:/mnt/openstudio
      - ./external_batch:/opt/openstudio/external_batch:ro
      # Tracked dir (only a README in git); drop id_rsync/known_hosts in it to
      # enable the Nomad rsync bridge — see external_batch/nomad/ssh/README.md.
      # A dir mount keeps fresh-clone `docker compose up` working, unlike
      # file mounts whose gitignored sources would not exist yet.
      - ./external_batch/nomad/ssh:/config/ssh:ro
    command: /usr/local/bin/start-server
  web-background:
    image: nrel/openstudio-server:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      target: base
      args:
        rails_env: docker
    environment:
      - OS_SERVER_NUMBER_OF_WORKERS=${OS_SERVER_NUMBER_OF_WORKERS:-1}
      - QUEUES=background,analyses
      - REDIS_URL=${REDIS_URL}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - OS_SERVER_EXTERNAL_BATCH_ROOT=/mnt/openstudio/external_batch
      - OS_SERVER_NOMAD_SSH_HOST=${OS_SERVER_NOMAD_SSH_HOST}
      - NOMAD_ADDR=${NOMAD_ADDR}
    depends_on:
      - db
      - queue
      - web
    volumes:
      - osdata:/mnt/openstudio
      - ./external_batch:/opt/openstudio/external_batch:ro
      # Tracked dir (only a README in git); drop id_rsync/known_hosts in it to
      # enable the Nomad rsync bridge — see external_batch/nomad/ssh/README.md.
      # A dir mount keeps fresh-clone `docker compose up` working, unlike
      # file mounts whose gitignored sources would not exist yet.
      - ./external_batch/nomad/ssh:/config/ssh:ro
    command: /usr/local/bin/start-web-background
  worker:
    image: nrel/openstudio-server:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      target: base
      args:
        rails_env: docker
    environment:
      - OS_SERVER_NUMBER_OF_WORKERS=${OS_SERVER_NUMBER_OF_WORKERS:-1}
      - QUEUES=requeued,simulations
      - COUNT=1
      - REDIS_URL=${REDIS_URL}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
    depends_on:
      - web
      - db
      - queue
      - rserve
    command: /usr/local/bin/start-workers
  rserve:
    image: nrel/openstudio-rserve:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build: ./docker/R
    environment:
      - OS_SERVER_NUMBER_OF_WORKERS=${OS_SERVER_NUMBER_OF_WORKERS:-1}
      - REDIS_URL=${REDIS_URL}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
    volumes:
      - osdata:/mnt/openstudio
    depends_on:
      - web
      - web-background
      - db
volumes:
  osdata:
    external: true
  dbdata:
    external: true
